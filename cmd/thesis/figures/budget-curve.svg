<figcaption><strong>The comparison is a function of the budget, not a point.</strong> Every line is measured on the same slice: 4,190,603 scored events over 7 days, of which 549 are labelled, a base rate of one in 7,633. Each point is one method at one measured budget. A method that found nothing at a budget is drawn on the <em>found nothing</em> row below the axis break rather than omitted, so a flat line there reads as measured rather than as missing; the methods leave that row at six different budgets, which is the comparison this figure exists to make.
<br><br>
<strong>Colour is the scope of the null, not who wrote the method.</strong> Blue judges an event against the history of the account that produced it, orange against the pooled population (§1.2). <code>entity_ewma</code> is a comparator drawn in blue because it keeps a per-entity mean; this framework's arms are the heavier strokes in that family, and every method's scope is recorded in the curve file. A method's own &#945; is lower than the budget's by the detections it found, at most 16% at 10 alerts a day and 0.6% at 10,000.
<br><br>
The figure draws the four comparators with the most detections over the budget range, so the choice does not flatter this framework; the other four reached too little to plot, and the table below lists all eight that were run. <em>Every reading here is an upper bound on this framework's disadvantage and a lower bound on its precision.</em> The corpus has no true negative class, so an unlabelled alert on genuine but unrecorded malicious activity counts as a false alarm (§12.5). The baselines read a fixed-length numeric vector per event and only <code>entity_ewma</code> holds per-entity state; they are not held to R2 or R4 (§12.4).</figcaption>
</figure>