<figcaption><strong>The comparison is a function of the budget, not a point.</strong> Every line is measured on the same slice: 4,190,603 scored events over 7 days, of which 549 are labelled, a base rate of one in 7,633. Each point is one detector at one alert budget: the share of its own queue that is real on the horizontal axis, and the rate at which it alarms on a background event on the vertical. A detector that found nothing at a budget is drawn in the column marked 0 rather than omitted, so a flat line at zero reads as measured rather than as missing.
<br><br>
At 10 alerts a day this framework's queue is 0.0% real at a false-alarm rate of 1.7&#215;10&#8315;&#8309;; at 10000 a day it is 0.59% real at 1.7&#215;10&#8315;&#178;. The baselines are the strongest available comparators rather than a representative sample: they are the four of eight measured reference implementations with the most detections summed over the budget range, so the comparison is not flattered by the choice. The four not drawn were run on the same events and reached too little to plot: eif (none at any budget), iforest (none at any budget), pca (none at any budget) and rrcf (one, at the widest budget).
<br><br>
<em>Both axes are upper bounds on the framework's disadvantage and lower bounds on its precision.</em> The corpus has no true negative class, so an unlabelled alert on genuine but unrecorded malicious activity counts as a false alarm (§12.5). The baselines read a fixed-length numeric vector per event with no per-entity state, which is the standard formulation this work argues against, and they are not held to R2 or R4 (§12.4).</figcaption>
</figure>