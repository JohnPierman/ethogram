name: pages

# Publishes the paper and the results dashboard to GitHub Pages.
#
# The point is not convenience. This repository's central discipline is that no number
# reaches a reader unless a recorded run produced it, and the checks that enforce it —
# dashboard-check for the dashboard, paper-check for the paper — run BEFORE the publish
# step and fail the job. A page that cannot be built without a backing run is the
# provenance rule made enforceable rather than merely stated.
#
# It runs only on main, so a pull request cannot publish, and only after ci has passed on
# the same commit, so a page is never published from a tree whose tests are red.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. Not cancel-in-progress: a half-finished deploy would leave the
# published page in a state no commit corresponds to.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"

jobs:
  publish:
    # Two conditions, and the second is not a formality.
    #
    # `vars.PUBLISH_PAGES` must be 'true' on the repository. It is a deliberate switch
    # rather than a default: publishing puts corpus-derived figures on the open web, and
    # that stays a decision somebody made rather than something a merge did quietly. To
    # stop publishing, set it to 'false' — the job then reports SKIPPED, which states what
    # is true. It is a skip and not a `continue-on-error` because a job that ran and
    # reported success without publishing would say the site is live when it is not, and a
    # job that failed on every merge would teach everyone to ignore a red check, which is
    # the same alert-fatigue failure the paper is about.
    #
    # The provenance gates below are not the only copy: ci.yml runs dashboard-check and
    # paper-check on every push to main independently, so a stale document fails the build
    # whether or not publishing is switched on.
    #
    # Only when ci actually passed. workflow_run fires on failure too, and publishing a
    # dashboard built from a tree with failing tests is exactly what this gate prevents.
    if: >
      vars.PUBLISH_PAGES == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.mod

      # The currency gates, before anything is assembled. Both are the same checks ci
      # runs; repeating them here means the publish path cannot be satisfied by a green
      # ci on a different commit.
      - name: dashboard is current with results
        run: make dashboard-check

      - name: paper page is current with its source
        run: make paper-check

      # The site serves only rendered artefacts: paper.html, paper.pdf, dashboard.html.
      #
      # Markdown is deliberately NOT linked from the index. GitHub renders Markdown in the
      # repository browser but Pages serves it as a file, so a link to PAPER.md hands the
      # reader raw text where they expected a document. The Markdown sources are copied so
      # existing links keep resolving, and the index points at the repository for anything
      # that reads better rendered by GitHub.
      #
      # No static-site generator: adding one would put a build step between the results
      # and the reader, which is the thing this project keeps removing.
      - name: assemble the site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp README.md _site/README.md
          cp DATA.md _site/DATA.md
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ethogram</title>
          <style>
          :root{--ink:#17191B;--ink-3:#6B7379;--accent:#1C4657;--rule:#D9DEE0;
            --panel:#F1F4F5;--page:#FFFFFF}
          @media (prefers-color-scheme:dark){:root{--ink:#E8EAEB;--ink-3:#8C9499;
            --accent:#7FB3C8;--rule:#3A4147;--panel:#22272B;--page:#17191B}}
          *{box-sizing:border-box;margin:0;padding:0}
          body{background:var(--page);color:var(--ink);font-family:Georgia,serif;
            line-height:1.6;max-width:44rem;margin:0 auto;padding:3rem 1.25rem}
          h1{color:var(--accent);font-size:2rem;margin-bottom:.25rem}
          p{margin:1rem 0;max-width:38rem}
          .sub{color:var(--ink-3);font-family:"Segoe UI",sans-serif;font-size:.9rem}
          a{color:var(--accent)}
          ul{list-style:none;margin:2rem 0}
          li{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
            padding:.9rem 1.1rem;margin:.6rem 0}
          li b{display:block;font-size:1.05rem}
          li span{color:var(--ink-3);font-size:.88rem;
            font-family:"Segoe UI",sans-serif}
          footer{margin-top:3rem;color:var(--ink-3);font-size:.8rem;
            border-top:1px solid var(--rule);padding-top:.8rem}
          </style>
          </head>
          <body>
          <h1>ethogram</h1>
          <p class="sub">Per-entity anomaly detection in security telemetry</p>
          <p>An <i>ethogram</i> is ethology's catalogue of the behaviours of one
          individual. An account has one too — and this reports when an account departs
          from its own behaviour, rather than from the organisation's average.</p>
          <ul>
            <li><a href="paper.html"><b>The paper</b></a>
              <span>The problem, the null hypothesis behind every detector, and the
              results — including the ones that failed. Start here.
              Also as a <a href="paper.pdf">PDF</a>.</span></li>
            <li><a href="dashboard.html"><b>Results dashboard</b></a>
              <span>Every recorded run, by arm, budget and attack type, against the
              population-scope baselines.</span></li>
            <li><a href="https://github.com/JohnPierman/ethogram"><b>The repository</b></a>
              <span>The Go package, the recorded runs under <code>results/</code>, and
              <code>DATA.md</code> for corpus sources and checksums.</span></li>
          </ul>
          <footer>Every number published here came out of a recorded run. This site is
          built only if <code>make dashboard-check</code> and <code>make paper-check</code>
          both pass, so a document that has drifted from its source fails the build rather
          than reaching a reader.</footer>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
